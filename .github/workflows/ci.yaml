name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # tsdown@0.23 needs Node >=22.18 to build; the floor is a consumer
          # promise, tested below against the packed tarball.
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
      # The packed tarball: exports, types and files as a consumer resolves them.
      - run: pnpm check:package
      - run: pnpm pack --pack-destination /tmp/checkout-sdk-pack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkout-sdk-tarball
          path: /tmp/checkout-sdk-pack/*.tgz

  consumer:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.0", "22.12.0", "24"]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checkout-sdk-tarball
          path: /tmp/checkout-sdk-pack

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      # `engines` promises require(esm) can load the ESM dist from the floor up.
      - run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y
          npm install /tmp/checkout-sdk-pack/*.tgz
          node -e "require('@unopago/checkout-sdk'); require('@unopago/checkout-sdk/embed'); require('@unopago/checkout-sdk/webhooks')"
